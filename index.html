<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NKEラ部</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="NKEラ部">
  <meta name="application-name" content="NKEラ部">
  <meta name="theme-color" content="#1f5fbf">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    html, body { margin: 0; min-height: 100%; }
    body {
      background: #1f5fbf; color: #fff; text-align: center; line-height: 1.6;
      font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
    }
    .wrap { max-width: 420px; margin: 0 auto; padding: 48px 20px; }
    img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
    h1 { font-size: 22px; margin: 16px 0 24px; }
    .btn {
      display: block; background: #fff; color: #1747a6; font-weight: 700; font-size: 17px;
      text-decoration: none; padding: 14px; border-radius: 12px;
    }
    .howto { margin-top: 28px; background: rgba(255,255,255,.12); border-radius: 12px; padding: 14px 16px; text-align: left; font-size: 14px; }
    .howto b { display: block; margin-bottom: 4px; }
    .howto p { margin: 0 0 10px; }
    .howto p:last-child { margin: 0; }
    #launching { display: none; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="icon-192.png" alt="NKEラ部">
    <h1>NKEラ部 ラーメンマップ</h1>
    <div id="launching">開いています…</div>
    <div id="guide">
      <a class="btn" id="go" href="#">アプリを開く</a>
      <div class="howto">
        <b>📱 ホーム画面に追加すると便利です</b>
        <p><b>iPhone（Safari）</b>画面下の共有ボタン（□に↑）→「ホーム画面に追加」</p>
        <p><b>Android（Chrome）</b>右上の︙ →「ホーム画面に追加」または「アプリをインストール」</p>
        <p>追加したアイコンから起動すると、自動でアプリが開きます。</p>
      </div>
    </div>
  </div>
  <script>
    // GASのWebアプリの公開URL（デプロイIDが変わったらここを書き換える）
    var APP_URL = 'https://script.google.com/macros/s/AKfycby9G6spVwYzMOyE2WrEoH9kxh0pr6zk3jUC52R6eu6PXKc3nTdr6TrwgOwmGAYo-mMmKw/exec';
    document.getElementById('go').href = APP_URL;
    // ホーム画面のアイコンから起動したときだけ、自動でアプリへ移動する
    var standalone = window.navigator.standalone === true ||
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    if (standalone) {
      document.getElementById('guide').style.display = 'none';
      document.getElementById('launching').style.display = 'block';
      location.replace(APP_URL);
    }
  </script>
</body>
</html>
